<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Unlock Copy</title>
  <!--
    A pointer at the end of a run of selected text. It depicts the thing the
    extension gives back, rather than the abstraction: you dragged across text
    the site tried to make unselectable, and the cursor is sitting where the
    selection ends.

    Three decisions worth keeping:

    - No padlock. Every extension in this category uses one, and a padlock says
      "security" rather than "copy text". It also closed into a loop with a tail
      and rendered as the digit 6 at 16px.
    - The selection is two solid slabs, not thin lines of text. Bars slim enough
      to read as text at 128px are under a pixel at 16px and merge into a green
      blur, which is the single most common way an extension icon turns to mush.
    - The pointer is drawn twice: once as a fat stroke in the tile's own
      gradient, then filled white on top. That knockout is what stops a white
      pointer from dissolving into the white slab it overlaps. The gradient uses
      userSpaceOnUse so the halo matches the tile exactly at every point.

    See icon-small.svg for the 16 and 32px artwork, which is redrawn rather than
    scaled.
  -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="124" y2="124">
      <stop offset="0" stop-color="#2fb96d" />
      <stop offset="1" stop-color="#12703c" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#tile)" />

  <!-- Selected text: a full line, then a partial one ending at the pointer. -->
  <rect x="22" y="25" width="74" height="22" rx="7" fill="#ffffff" />
  <rect x="22" y="60" width="50" height="22" rx="7" fill="#ffffff" />

  <path
    d="M58 47 L58 95 L70.7 83.2 L79.7 103.2 L88.7 99.2 L79.7 79.4 L96.4 78.2 Z"
    fill="none"
    stroke="url(#tile)"
    stroke-width="11"
    stroke-linejoin="round"
  />
  <path d="M58 47 L58 95 L70.7 83.2 L79.7 103.2 L88.7 99.2 L79.7 79.4 L96.4 78.2 Z" fill="#ffffff" />
</svg>
