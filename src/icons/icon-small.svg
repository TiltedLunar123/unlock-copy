<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Unlock Copy, small sizes</title>
  <!--
    The 16 and 32px artwork. Same mark as icon.svg, redrawn rather than scaled,
    because scaling loses the small features first and those are the ones doing
    the work at toolbar size.

    What changed from the full drawing, and why:
      - slabs are 24 units tall instead of 22, with the gap widened to 14, since
        anything under about 12 units of gap closes up under antialiasing
      - the pointer is scaled up and its knockout stroke widened to 13, so the
        halo separating it from the slab survives being a pixel and a half
      - corner radius stays well under half the height; a fully rounded pill
        stops reading as highlighted text and starts reading as a lollipop

    Three masses is the whole budget at 16px: the top slab, the short slab, and
    the pointer. Nothing else fits.
  -->
  <defs>
    <linearGradient id="tileSmall" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="124" y2="124">
      <stop offset="0" stop-color="#2fb96d" />
      <stop offset="1" stop-color="#12703c" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#tileSmall)" />

  <rect x="20" y="24" width="76" height="24" rx="8" fill="#ffffff" />
  <rect x="20" y="62" width="48" height="24" rx="8" fill="#ffffff" />

  <path
    d="M56 48 L56 97.3 L69 85.1 L78.3 105.7 L87.5 101.6 L78.3 81.2 L95.4 80.1 Z"
    fill="none"
    stroke="url(#tileSmall)"
    stroke-width="13"
    stroke-linejoin="round"
  />
  <path d="M56 48 L56 97.3 L69 85.1 L78.3 105.7 L87.5 101.6 L78.3 81.2 L95.4 80.1 Z" fill="#ffffff" />
</svg>
